[package]
edition.workspace = true
license.workspace = true
name = "lean-dup-cli"
version.workspace = true

[[bin]]
name = "lean-dup"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
lean-dup-diagnostics = { path = "../diagnostics" }
lean-dup-embedding = { path = "../embedding" }
lean-dup-eval = { path = "../eval" }
lean-dup-index = { path = "../index" }
lean-dup-project = { path = "../project" }
lean-dup-report = { path = "../report" }
lean-dup-search = { path = "../search" }
lean-dup-worker = { path = "../worker" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
rusqlite = { version = "0.39", features = ["bundled"] }
tempfile = "3"
