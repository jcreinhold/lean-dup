[package]
categories = ["command-line-utilities", "development-tools"]
description = "Read-only duplicate auditor for Lean 4 Lake workspaces"
edition = { workspace = true }
keywords = ["audit", "duplication", "lake", "lean", "lean4"]
license = { workspace = true }
name = "lean-dup"
readme = "README.md"
repository = { workspace = true }
version = { workspace = true }

[lib]
doctest = false
name = "lean_dup"
path = "src/lib.rs"

[[bin]]
name = "lean-dup"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
lean-dup-capability-source = { workspace = true }
lean-dup-diagnostics = { workspace = true }
lean-dup-eval = { workspace = true }
lean-dup-index = { workspace = true }
lean-dup-project = { workspace = true }
lean-dup-report = { workspace = true }
lean-dup-search = { workspace = true }
lean-dup-worker = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
lean-dup-test-support = { workspace = true }
predicates = { workspace = true }
rusqlite = { workspace = true }
toml = { workspace = true }
