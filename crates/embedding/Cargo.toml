[package]
edition.workspace = true
license.workspace = true
name = "lean-dup-embedding"
version.workspace = true

[dependencies]
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
fastembed = { version = "5.13.4", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "rustls-tls"] }
lean-dup-diagnostics = { path = "../diagnostics" }
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokenizers = "0.23.1"

[dev-dependencies]
tempfile = "3"
