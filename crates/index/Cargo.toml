[package]
edition.workspace = true
license.workspace = true
name = "lean-dup-index"
version.workspace = true

[dependencies]
lean-dup-diagnostics = { path = "../diagnostics" }
lean-dup-project = { path = "../project" }
lean-dup-worker = { path = "../worker" }
rusqlite = { version = "0.39", features = ["bundled"] }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
toml = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
