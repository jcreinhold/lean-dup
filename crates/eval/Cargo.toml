[package]
edition.workspace = true
license.workspace = true
name = "lean-dup-eval"
version.workspace = true

[dependencies]
lean-dup-diagnostics = { path = "../diagnostics" }
lean-dup-embedding = { path = "../embedding" }
lean-dup-index = { path = "../index" }
lean-dup-project = { path = "../project" }
lean-dup-search = { path = "../search" }
lean-dup-worker = { path = "../worker" }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
