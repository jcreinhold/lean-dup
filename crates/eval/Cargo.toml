[package]
edition.workspace = true
license.workspace = true
name = "lean-dup-eval"
version.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
lean-dup-index = { path = "../index" }
lean-dup-project = { path = "../project" }
lean-dup-report = { path = "../report" }
lean-dup-search = { path = "../search" }
lean-dup-worker = { path = "../worker" }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
