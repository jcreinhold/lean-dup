[package]
categories = ["development-tools"]
description = "Packaged LeanDup capability Lean source and the per-toolchain build that produces its shared-facet dylib for lean-dup."
edition = { workspace = true }
include = ["Cargo.toml", "lean/LeanDup.lean", "lean/LeanDup/**/*.lean", "src/**/*.rs"]
keywords = ["audit", "duplication", "lean", "lean4"]
license = { workspace = true }
name = "lean-dup-capability-source"
repository = { workspace = true }
version = { workspace = true }

[dependencies]
lean-rs-interop-shims = { workspace = true }
lean-rs-worker-protocol = { workspace = true }
lean-semantic-search-runtime = { workspace = true }
lean-toolchain = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true
