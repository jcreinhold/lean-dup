[package]
categories = ["development-tools"]
description = "Packaged lean-dup-worker Lean source and the per-toolchain build that produces the native worker executable for lean-dup."
edition = { workspace = true }
include = ["Cargo.toml", "lean/lakefile.lean", "lean/Main.lean", "lean/LeanDup.lean", "lean/LeanDup/**/*.lean", "src/**/*.rs"]
keywords = ["audit", "duplication", "lean", "lean4"]
license = { workspace = true }
name = "lean-dup-capability-source"
repository = { workspace = true }
version = { workspace = true }

[dependencies]
lean-semantic-search-runtime = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true
