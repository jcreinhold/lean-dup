[project]
name = "lean-dup"
version = "0.1.0"
description = "General-purpose duplication auditor for Lean 4 projects."
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
lean-dup = "lean_dup.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff"]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
