[project]
dependencies = []
description = "General-purpose duplication auditor for Lean 4 projects."
license = "MIT OR Apache-2.0"
name = "lean-dup"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[project.scripts]
lean-dup = "lean_dup.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff"]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.10.9,<0.11.0"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
