# Config for `mdwright check` / `mdwright fmt` on this repo's Markdown.

[fmt]
wrap = 120

# CLAUDE.md (and its AGENTS.md symlink) and everything under .claude/ are
# owned outside the docs flow — never reflow or lint them.
exclude = [".claude/**", "AGENTS.md", "CLAUDE.md"]

[render]
profile = "pulldown"

[lint]
exclude = [".claude/**", "AGENTS.md", "CLAUDE.md"]
