name: ci
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: check + fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `crates/vector-index` depends on lance/lancedb; the transitive
      # `lance-encoding` build script compiles `.proto` schemas and needs a
      # `protoc` binary on PATH (the vendoring `protoc` feature only covers the
      # pinned 6.0.1 path, not the newer lance lancedb pulls in). ubuntu-latest
      # does not ship protoc by default.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # Several lean-dup tests shell out to `lake` (the Lean build tool):
      # crates/eval/src/eval/suites.rs builds fixtures, the cli integration
      # suite runs the full audit pipeline against pre-built Lean fixtures.
      # Install elan + the toolchain pinned by lean/lean-toolchain (all four
      # lean-toolchain files in the repo agree on the same version), then
      # pre-build each fixture so the Rust tests find the .olean artifacts.
      - name: Read pinned Lean toolchain
        id: lean
        run: echo "toolchain=$(tr -d '[:space:]' < lean/lean-toolchain)" >> "$GITHUB_OUTPUT"
      - name: Cache elan toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ steps.lean.outputs.toolchain }}
      - name: Install elan and pinned Lean toolchain
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "${{ steps.lean.outputs.toolchain }}"
          "$HOME/.elan/bin/elan" default "${{ steps.lean.outputs.toolchain }}"
      - name: Cache Lean fixture and lean/ builds
        uses: actions/cache@v5
        with:
          path: |
            lean/.lake
            tests/fixtures/tiny/.lake
            tests/fixtures/external/.lake
            tests/fixtures/source-backed/.lake
          key: lake-builds-${{ runner.os }}-${{ steps.lean.outputs.toolchain }}-${{ hashFiles('lean/**/*.lean', 'lean/lakefile.*', 'tests/fixtures/**/*.lean', 'tests/fixtures/**/lakefile.*', '**/lean-toolchain') }}
      - name: Build lean/ and Lean fixtures
        run: |
          set -euo pipefail
          # The lean/ package builds the LeanDup shared-facet capability dylib
          # that the lean-rs-worker-parent pool loads (Rust drives Lean through
          # the pool, not a subprocess). This also produces LeanDup.olean, which
          # the audit pipeline imports, so cargo tests find it.
          ( cd lean && lake build LeanDup )
          for fixture in tests/fixtures/tiny tests/fixtures/external tests/fixtures/source-backed; do
            ( cd "$fixture" && lake build )
          done
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The worker child is a separate crate's binary; `cargo test` does not
      # force-build it for the cli integration tests, so build it once here and
      # point the parent at it via LEAN_DUP_WORKER_CHILD (exported to GITHUB_ENV
      # so every later step — tests, doctor, evals — resolves the same binary).
      - name: Provision worker-child
        run: |
          set -euo pipefail
          cargo build -p lean-dup-worker-child --locked
          echo "LEAN_DUP_WORKER_CHILD=$PWD/target/debug/lean-dup-worker-child" >> "$GITHUB_ENV"
      - run: cargo test --workspace --locked
      - name: Boundary tests
        run: cargo test -p lean-dup-cli --test boundaries --locked
      - name: Release diagnostics
        run: |
          set -euo pipefail
          cargo run -p lean-dup-cli --locked -- --version
          cargo run -p lean-dup-cli --locked -- doctor \
            --workspace tests/fixtures/tiny --module Tiny --format json \
            > target/doctor-ci.json
          jq -e '.report_schema_version == "lean-dup.report.v3"' target/doctor-ci.json
          jq -e '.worker.protocol_version == "lean-dup.worker.v1"' target/doctor-ci.json
      - name: Fixture evals
        run: |
          set -euo pipefail
          mkdir -p target/eval
          cargo run -p lean-dup-cli --locked -- eval \
            --suite default --format json --output target/eval/default.json \
            > target/eval/default.stdout
          cargo run -p lean-dup-cli --locked -- eval \
            --suite hard-negatives --format json --output target/eval/hard-negatives.json \
            > target/eval/hard-negatives.stdout
          jq -e '.status == "ok"' target/eval/default.json
          jq -e '.metrics.hard_negative_hits.found == 0' target/eval/hard-negatives.json
      - name: Report contract fixture
        run: |
          set -euo pipefail
          mkdir -p target/report-contract
          cargo run -p lean-dup-cli --locked -- audit \
            --workspace tests/fixtures/tiny --module Tiny \
            --no-semantic-probes --format json \
            > target/report-contract/ordinary-audit.json
          jq -e '.report_schema_version == "lean-dup.report.v3"' target/report-contract/ordinary-audit.json
          jq -e '.visible_groups_emitted <= .visible_group_limit' target/report-contract/ordinary-audit.json
          jq -e '.review.groups == null' target/report-contract/ordinary-audit.json
