name: ci
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE-*'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: check + fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Library + bin unit tests across the workspace, plus the static-manifest
      # boundaries check. The crates/cli/tests/cli.rs integration suite shells
      # out to `lake` and is intentionally skipped in CI — run it locally with
      # `cargo test -p lean-dup-cli --test cli`.
      - run: cargo test --workspace --locked --lib --bins
      - run: cargo test -p lean-dup-cli --test boundaries --locked
