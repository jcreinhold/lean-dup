name: Release

# Tag-triggered release. Pushing a `v<semver>` tag (e.g. `v0.2.2`, `v0.2.2-rc.1`)
# runs the full gate (`verify`), then publishes every crate to crates.io in
# dependency order and creates a GitHub Release whose body is the matching
# `## [<version>]` section of `CHANGELOG.md` (`publish`, depends on `verify`).
#
# Manual re-runs use `workflow_dispatch` with `dry_run: true` to exercise the
# gates without uploading or creating a release. A live re-run (dry_run: false)
# is idempotent: each crate is skipped if its version is already on crates.io, so
# a partial release can be completed without burning a version (crates.io
# versions are immutable).
#
# `CARGO_REGISTRY_TOKEN` must be set in the repository secrets before the first
# tag push — a scoped publish token from <https://crates.io/settings/tokens>.
#
# Lean split drives the job layout. Only the `verify` gate installs Lean; the
# `publish` job is Lean-free — it uploads every crate with `--no-verify` in
# dependency order, relying on that gate. (Since v0.3.0 nothing links
# libleanshared — the native `lean-dup-worker` executable is built by
# `install-worker` on the user's machine — but keeping publish Lean-free means
# the gate, not the publisher, performs all builds.)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run all gates but skip the crates.io publish and GitHub Release."
        type: boolean
        default: false

concurrency:
  # One release at a time per tag. `cancel-in-progress: false`: a half-finished
  # publish that gets cancelled mid-run wastes a published crate version
  # (crates.io versions are immutable).
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # softprops/action-gh-release creates the GitHub Release.

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install elan + pinned Lean toolchain
        run: |
          set -euo pipefail
          # Nothing links libleanshared since v0.3.0, but keep the pinned
          # toolchain installed so the gate still exercises the environment a
          # user provisions in (and catches a dependency reintroducing a
          # Lean-needing build script). Tracks lean/lean-toolchain.
          toolchain="$(tr -d '[:space:]' < lean/lean-toolchain)"
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$toolchain"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "LEAN_SYSROOT=$HOME/.elan/toolchains/leanprover--lean4---${toolchain##*:}" >> "$GITHUB_ENV"

      - name: Verify tag matches workspace version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="lean-dup"))')"
          expected="v${version}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::Tag $tag does not match workspace version $version (expected $expected). Bump Cargo.toml or re-tag."
            exit 1
          fi
          echo "Tag $tag matches workspace version $version"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Build the parent CLI PER-MEMBER, never workspace-wide: a per-member
      # build keeps the CLI's feature set isolated so a dependency change cannot
      # silently re-link libleanshared into the parent.
      - name: parent CLI ⊥ libleanshared
        run: |
          set -euo pipefail
          cargo build --release -p lean-dup --locked
          if ldd target/release/lean-dup | grep -q libleanshared; then
            echo "::error::parent CLI links libleanshared — cargo install lean-dup would require a Lean runtime" >&2
            exit 1
          fi

      - name: Packaging sanity
        run: |
          set -euo pipefail
          # The crates.io page is blank without a crate-local README.
          cargo package --list -p lean-dup | grep -qx 'README.md' \
            || { echo "::error::lean-dup crate would publish without README.md"; exit 1; }
          # The capability dylib cannot be built on a user's machine without the
          # packaged Lean source.
          cargo package --list -p lean-dup-capability-source | grep -qx 'lean/LeanDup.lean' \
            || { echo "::error::capability-source crate omits its packaged Lean source"; exit 1; }

      # Only the leaf crates (no unpublished internal deps) can be dry-run before
      # the ordered publish makes each dependency available on crates.io.
      - name: Publish dry-run (leaf crates)
        run: |
          set -euo pipefail
          for crate in lean-dup-capability-source lean-dup-diagnostics lean-dup-worker; do
            cargo publish -p "$crate" --no-verify --dry-run
          done

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Resolve workspace version
        id: ver
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="lean-dup"))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to crates.io (dependency order, idempotent)
        if: inputs.dry_run != true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not configured."
            exit 1
          fi
          publish_one() {
            crate="$1"
            # crates.io returns 200 for an existing version, 404 otherwise. A
            # User-Agent is required or the API returns 403.
            if curl -sf -o /dev/null \
                 -H "User-Agent: lean-dup-release (github.com/jcreinhold/lean-dup)" \
                 "https://crates.io/api/v1/crates/$crate/$version"; then
              echo "✓ $crate@$version already on crates.io — skipping"
              return 0
            fi
            # crates.io rate-limits NEW crates (a small burst, then ~1 per 10
            # minutes). A first release creates many new crates, so 429s are
            # expected mid-sequence; wait out the limit and retry rather than
            # aborting a half-finished publish. --no-verify: this Lean-free job
            # delegates all builds to the verify gate.
            attempt=0
            while :; do
              attempt=$((attempt + 1))
              echo "→ publishing $crate@$version (attempt $attempt)"
              if cargo publish -p "$crate" --no-verify 2>&1 | tee /tmp/pub.out; then
                break
              fi
              if grep -qiE "already (exists|uploaded)|is already uploaded" /tmp/pub.out; then
                echo "  $crate@$version already on crates.io (race) — continuing"
                break
              fi
              if grep -qiE "429|too many requests" /tmp/pub.out; then
                if [ "$attempt" -ge 9 ]; then
                  echo "::error::$crate still rate-limited after $attempt attempts"
                  exit 1
                fi
                echo "  rate-limited (429); waiting 660s before retry…"
                sleep 660
                continue
              fi
              echo "::error::failed to publish $crate@$version"
              exit 1
            done
            # crates.io needs a moment to index a new crate before a dependent
            # crate referencing it can resolve.
            sleep 15
          }
          # Dependency order (leaves first): a dependent crate's deps must already
          # be on crates.io when it publishes.
          publish_one lean-dup-capability-source
          publish_one lean-dup-diagnostics
          publish_one lean-dup-worker
          publish_one lean-dup-project
          publish_one lean-dup-index
          publish_one lean-dup-search
          publish_one lean-dup-eval
          publish_one lean-dup-report
          publish_one lean-dup

      # The release marker is the `v<version>` tag. Derive the version from the
      # workspace (not the trigger ref) so a resumed `workflow_dispatch` run —
      # used to finish a publish interrupted by crates.io rate limits — still
      # attaches the GitHub Release to the existing tag.
      - name: Extract CHANGELOG section for this release
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "::error::No CHANGELOG section for [$version]; add one before tagging."
            exit 1
          fi
          echo "--- Release body ---"
          cat release-body.md
          echo "--- End release body ---"

      - name: Create GitHub Release
        if: inputs.dry_run != true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          body_path: release-body.md
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          make_latest: ${{ contains(steps.ver.outputs.version, '-') && 'false' || 'true' }}
